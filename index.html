      root.addEventListener('click', onClick);
      root.addEventListener('input', onInput);
      root.addEventListener('change', onChange);
      root.addEventListener('toggle', function (e) { var d = e.target; if (d && d.classList && d.classList.contains('ad-acc')) A.open[d.getAttribute('data-k')] = d.open; }, true);
      g.addEventListener('resize', function () { if (A.root && A.root.querySelector('.fr')) fitPrev(); });
      g.addEventListener('beforeunload', function (e) { if (A.dirty && /admin/.test(location.hash)) { e.preventDefault(); e.returnValue = ''; } });
    }
    root.innerHTML = '<div class="nf"><p>Memuat panel…</p></div>';
    api.status().then(function (st) { if (!st.hasPassword) screen('setup'); else if (!st.authed) screen('login'); else enter(); }).catch(function (er) { root.innerHTML = '<div class="nf"><h1>Gagal memuat panel</h1><p>' + esc(er.message || er) + '</p></div>'; });
  };
})(window);

/* ===== Lapisan data MANDIRI: localStorage + IndexedDB (tanpa server) ===== */
(function (g) {
  'use strict';
  var AWS = g.AWS, S = AWS.S;
  var KC = 'aws.cfg.v1', KA = 'aws.auth.v1', KS = 'aws.sess.v1', DBN = 'aws-media-v1', ST = 'm';
  var mem = {};
  function lsGet(k) { try { return g.localStorage.getItem(k); } catch (e) { return mem[k] || null; } }
  function lsSet(k, v) { try { g.localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
  function lsDel(k) { try { g.localStorage.removeItem(k); } catch (e) { } delete mem[k]; }
  function ssGet(k) { try { return g.sessionStorage.getItem(k); } catch (e) { return mem['s' + k] || null; } }
  function ssSet(k, v) { try { g.sessionStorage.setItem(k, v); } catch (e) { mem['s' + k] = v; } }
  function ssDel(k) { try { g.sessionStorage.removeItem(k); } catch (e) { } delete mem['s' + k]; }
  function jparse(s) { try { return JSON.parse(s); } catch (e) { return null; } }

  /* ---- IndexedDB (gambar) ---- */
  var memMedia = {};
  function idb() {
    return new Promise(function (res) {
      try {
        var r = g.indexedDB.open(DBN, 1);
        r.onupgradeneeded = function () { r.result.createObjectStore(ST, { keyPath: 'id' }); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function idbAll() {
    return idb().then(function (db) {
      if (!db) return Object.keys(memMedia).map(function (k) { return memMedia[k]; });
      return new Promise(function (res) {
        var q = db.transaction(ST, 'readonly').objectStore(ST).getAll();
        q.onsuccess = function () { res(q.result || []); }; q.onerror = function () { res([]); };
      });
    });
  }
  function idbPut(rec) {
    return idb().then(function (db) {
      if (!db) { memMedia[rec.id] = rec; return; }
      return new Promise(function (res, rej) { var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).put(rec); t.oncomplete = res; t.onerror = function () { rej(new Error('Penyimpanan gambar penuh atau diblokir.')); }; });
    });
  }
  function idbDel(id) {
    return idb().then(function (db) {
      if (!db) { delete memMedia[id]; return; }
      return new Promise(function (res) { var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).delete(id); t.oncomplete = res; t.onerror = res; });
    });
  }
  function idbClear() {
    return idb().then(function (db) {
      memMedia = {};
      if (!db) return;
      return new Promise(function (res) { var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).clear(); t.oncomplete = res; t.onerror = res; });
    });
  }

  /* ---- kata sandi ---- */
  var te = new TextEncoder();
  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function weak(pw, salt) { var h = 5381, s = salt + pw; for (var r = 0; r < 20000; r++) for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i) + r) | 0; return 'w' + (h >>> 0).toString(16); }
  function derive(pw, saltB64) {
    var sub = g.crypto && g.crypto.subtle;
    if (!sub) return Promise.resolve(weak(pw, saltB64));
    return sub.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return sub.deriveBits({ name: 'PBKDF2', salt: unb64(saltB64), iterations: 120000, hash: 'SHA-256' }, k, 256);
    }).then(b64);
  }
  function newSalt() { var a = new Uint8Array(16); if (g.crypto && g.crypto.getRandomValues) g.crypto.getRandomValues(a); else for (var i = 0; i < 16; i++) a[i] = Math.floor(Math.random() * 256); return b64(a); }
  function setPw(pw) {
    if (!pw || pw.length < 8) return Promise.reject(new Error('Kata sandi minimal 8 karakter.'));
    var salt = newSalt();
    return derive(pw, salt).then(function (h) { lsSet(KA, JSON.stringify({ salt: salt, hash: h })); });
  }
  function checkPw(pw) {
    var a = jparse(lsGet(KA)); if (!a) return Promise.resolve(false);
    return derive(pw || '', a.salt).then(function (h) { return h === a.hash; });
  }

  /* ---- seed (situs yang diunduh dari panel admin membawa data di sini) ---- */
  function readSeed() { var el = document.getElementById('aws-seed'); if (!el) return null; var o = jparse(el.textContent); return o && o.cfg ? o : null; }

  var A = AWS.api = {
    mode: 'local',
    canExportSite: true,
    init: function () {
      var seed = readSeed(), loc = jparse(lsGet(KC)), cfg = null;
      if (seed && loc) cfg = (loc.savedAt || 0) >= (seed.savedAt || 0) ? loc.cfg : seed.cfg;
      else cfg = loc ? loc.cfg : (seed ? seed.cfg : null);
      S.seedAt = seed ? seed.savedAt || 0 : 0;
      if (seed && seed.media) Object.keys(seed.media).forEach(function (k) { S.media[k] = seed.media[k]; });
      return idbAll().then(function (rows) {
        rows.forEach(function (r) { S.media[r.id] = { url: r.url, name: r.name, size: r.size, at: r.at }; });
        return cfg;
      });
    },
    status: function () { return Promise.resolve({ hasPassword: !!lsGet(KA), authed: ssGet(KS) === '1' }); },
    setup: function (o) { return setPw(o.password).then(function () { ssSet(KS, '1'); return { ok: true }; }); },
    login: function (pw) { return checkPw(pw).then(function (ok) { if (!ok) throw new Error('Kata sandi salah.'); ssSet(KS, '1'); return { ok: true }; }); },
    logout: function () { ssDel(KS); return Promise.resolve(); },
    changePassword: function (oldp, newp) { return checkPw(oldp).then(function (ok) { if (!ok) throw new Error('Kata sandi lama salah.'); return setPw(newp); }); },
    save: function (cfg) {
      return new Promise(function (res, rej) {
        try { g.localStorage.setItem(KC, JSON.stringify({ savedAt: Date.now(), cfg: cfg })); res({ ok: true }); }
        catch (e) { mem[KC] = JSON.stringify({ savedAt: Date.now(), cfg: cfg }); rej(new Error('Penyimpanan peramban penuh atau diblokir. Unduh cadangan agar data aman.')); }
      });
    },
    reset: function () { lsDel(KC); return idbClear().then(function () { S.media = {}; return { ok: true }; }); },
    upload: function (file) {
      return AWS.shrink(file).then(function (o) {
        var id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        var rec = { id: id, url: o.dataUrl, name: o.name, size: o.dataUrl.length, at: Date.now() };
        return idbPut(rec).then(function () { S.media[id] = { url: rec.url, name: rec.name, size: rec.size, at: rec.at }; return { id: id, url: rec.url, name: rec.name }; });
      });
    },
    removeMedia: function (id) { return idbDel(id).then(function () { delete S.media[id]; return { ok: true }; }); },
    exportAll: function (cfg) { return Promise.resolve({ app: 'agri-wangi-sentosa', v: 1, at: new Date().toISOString(), cfg: cfg, media: S.media }); },
    importAll: function (obj) {
      if (!obj || obj.app !== 'agri-wangi-sentosa' || !obj.cfg) return Promise.reject(new Error('Berkas bukan cadangan situs ini.'));
      var ids = Object.keys(obj.media || {}), p = Promise.resolve();
      ids.forEach(function (id) { var m = obj.media[id]; if (m && m.url && String(m.url).indexOf('data:') === 0) p = p.then(function () { return idbPut({ id: id, url: m.url, name: m.name || id, size: m.size || 0, at: m.at || Date.now() }).then(function () { S.media[id] = m; }); }); });
      return p.then(function () { return { cfg: obj.cfg }; });
    }
  };

})(window);

AWS.start();
</script>
</body>
